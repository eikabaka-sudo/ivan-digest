<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="referrer" content="no-referrer"><title>СКА — хоккей</title>
<style>
:root{color-scheme:dark;--bg:#1e1e2e;--ink:#cdd6f4;--muted:#bac2de;--accent:#cba6f7;--surface:#313244;--line:#585b70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-wrap:anywhere}.shell{max-width:720px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom))}header{border-bottom:1px solid var(--line);padding-bottom:22px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}h1{font:500 32px/1.25 Georgia,serif;letter-spacing:-.02em;margin:12px 0}h2{font:500 24px/1.3 Georgia,serif;margin:0 0 16px}p{margin:0 0 12px}.meta,.hint{font-size:13px;color:var(--muted)}section{padding:26px 0;border-bottom:1px solid var(--line)}section.player{background:var(--surface);padding:22px 18px;margin:24px -8px 0;border:0;border-radius:10px}.line{white-space:pre-wrap;font-size:15px}.bullet{padding-left:16px;position:relative}.bullet:before{content:'•';position:absolute;left:0;color:var(--accent)}strong{font-weight:650}a{color:var(--accent);text-underline-offset:4px;overflow-wrap:anywhere}.source{display:block;min-height:44px;padding:10px 0}button{min-height:46px;padding:10px 18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.table-wrap{max-width:100%;overflow-x:auto;margin-bottom:18px}table{border-collapse:collapse;font-size:14px;width:100%}th,td{border-bottom:1px solid var(--line);text-align:left;padding:9px 10px;min-width:75px}th{color:var(--accent)}code{font-size:.9em;color:var(--ink)}[hidden]{display:none!important}.state{padding:28px 0}
</style><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body>
<main class="shell"><header><p class="eyebrow">Хоккей / СКА</p><h1 id="title">Новости и матчи СКА</h1><p id="date" class="meta">Загружаем последний отчёт…</p><p class="hint">Матч, статистика и отдельный блок о Василии Глотове. Без оценок.</p></header><div id="state" class="state" role="status"><p id="message">Загрузка…</p><button id="retry" hidden>Попробовать снова</button></div><div id="report"></div><footer><p class="hint" style="margin-top:24px">Показан сохранённый выпуск с указанной датой. Новые отчёты появляются после запланированной проверки матча.</p></footer></main>
<script id="ska-core">
(function(){'use strict';
const validEdition=e=>typeof e==='string'&&/^[a-f0-9]{32}$/.test(e)&&e.length===32;
const safeUrl=url=>{const u=new URL(url);if(!['https:','http:'].includes(u.protocol)||u.username||u.password||!/^https?:\/\//.test(url))throw Error('Небезопасная ссылка');return u.href;};
const validate=(b,e)=>{if(!validEdition(e)||!b||b.edition!==e||b.kind!=='hockey'||b.ratings!==false||typeof b.title!=='string'||typeof b.date!=='string'||!Array.isArray(b.sections)||!Array.isArray(b.sources))throw Error('Неверный выпуск');for(const s of b.sections)if(typeof s.heading!=='string'||typeof s.text!=='string')throw Error('Неверный раздел');for(const s of b.sources){if(typeof s.title!=='string'||typeof s.url!=='string')throw Error('Неверный источник');safeUrl(s.url);}return b;};
if(typeof module!=='undefined'&&module.exports){module.exports={validEdition,safeUrl,validate};return;}
const tg=window.Telegram?.WebApp;
if(tg&&tg.platform!=='unknown'){try{tg.ready();tg.expand();}catch(_){}try{tg.setHeaderColor('#1e1e2e');}catch(_){}try{tg.setBackgroundColor('#1e1e2e');}catch(_){}try{tg.setBottomBarColor('#1e1e2e');}catch(_){}}
const $=id=>document.getElementById(id);const node=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
function inline(el,text){const re=/\*\*([^*]+)\*\*|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|`([^`]+)`/g;let start=0,m;while((m=re.exec(text))){el.append(document.createTextNode(text.slice(start,m.index)));if(m[1])el.append(node('strong','',m[1]));else if(m[4])el.append(node('code','',m[4]));else{try{const a=node('a','',m[2]);a.href=safeUrl(m[3]);a.target='_blank';a.rel='noopener noreferrer';el.append(a);}catch(_){el.append(document.createTextNode(m[2]));}}start=re.lastIndex;}el.append(document.createTextNode(text.slice(start)));}
function addLines(parent,text){const lines=text.split('\n');for(let i=0;i<lines.length;i++){const line=lines[i];if(!line.trim())continue;if(line.trim().startsWith('|')&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|\s*$/.test(lines[i+1])){const wrap=node('div','table-wrap');const table=node('table');const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());const row=(values,head)=>{const tr=node('tr');for(const v of values){const td=node(head?'th':'td');inline(td,v);tr.append(td);}table.append(tr);};row(cells(line),true);i++;while(i+1<lines.length&&lines[i+1].trim().startsWith('|'))row(cells(lines[++i]),false);wrap.append(table);parent.append(wrap);continue;}const bullet=/^\s*[-*]\s+/.test(line);const p=node('p',bullet?'line bullet':'line');inline(p,bullet?line.replace(/^\s*[-*]\s+/,''):line);parent.append(p);}}
async function load(){const params=new URLSearchParams(location.search);const e=params.getAll('e').length===1?params.get('e'):null;$('state').hidden=false;$('retry').hidden=true;$('report').replaceChildren();if(!validEdition(e)){$('message').textContent='Открой раздел кнопкой «🏒 СКА» в чате. В ссылке нет корректного выпуска.';return;}$('message').textContent='Загрузка…';const abort=new AbortController();const timer=setTimeout(()=>abort.abort(),15000);try{const r=await fetch('./editions/'+e+'.json',{cache:'no-store',signal:abort.signal});if(!r.ok)throw Error('HTTP '+r.status);const b=validate(await r.json(),e);$('title').textContent=b.title;$('date').textContent='Выпуск: '+b.date;for(const s of b.sections){const section=node('section',s.heading.includes('Глотов')?'player':'');const h=node('h2');inline(h,s.heading);section.append(h);addLines(section,s.text);$('report').append(section);}if(b.sources.length){const section=node('section');section.append(node('h2','','Источники'));for(const s of b.sources){const a=node('a','source',s.title+' ↗');a.href=safeUrl(s.url);a.target='_blank';a.rel='noopener noreferrer';section.append(a);}$('report').append(section);}$('state').hidden=true;}catch(_){$('message').textContent='Не удалось загрузить отчёт. Проверь подключение и попробуй снова.';$('retry').hidden=false;}finally{clearTimeout(timer);}}
$('retry').addEventListener('click',load);load();
})();
</script></body></html>
